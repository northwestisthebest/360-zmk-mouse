# Debug add-on, stacked on a variant by:  ./build.sh v1 debug   (or v2)
# The build also adds the zmk-usb-logging snippet. Read the log with:
#   sudo tio --log --log-file /tmp/mouse.log /dev/ttyACM1     (exit: Ctrl+t, q)

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192

# full ZMK trace: key scan, combos, keymap, HID button counts.
# Very chatty while the mouse moves - keep it still while capturing.
CONFIG_ZMK_LOG_LEVEL_DBG=y

# joystick: uncomment to tune scroll (hundreds of lines per second)
# CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
# CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
